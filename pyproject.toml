[project]
name = "cursor-hackathon"
version = "0.1.0"
description = "A FastAPI service for the Cursor hackathon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "exa-py>=2.18.1",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.35.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "playwright>=1.50.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
    "xai-sdk>=1.18.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
